<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makhanani LTSM — Textbook Barcodes — A4 3x5 v1.58</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#e5e7eb;color:#111;padding:16px}
header{text-align:center;background:#0a1f4d;color:#fff;padding:14px;border-radius:14px}header h1{margin:0;font-size:22px}header h1 span{color:#d4af37}
.controls{background:#fff;padding:12px;border-radius:12px;margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.filterBar{background:#fffbeb;border:3px solid #d4af37;border-radius:14px;padding:12px;margin:12px 0}
.filterRow{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{padding:11px;border-radius:9px;border:1px solid #ddd;flex:1;min-width:130px}
button{padding:11px 16px;border:none;border-radius:9px;font-weight:800;cursor:pointer}
.gold{background:#d4af37}.blue{background:#0a1f4d;color:#fff}.green{background:#059669;color:#fff}.red{background:#dc2626;color:#fff}.dark{background:#111827;color:#fff}.grey{background:#64748b;color:#fff}
.sheet{width:210mm;min-height:297mm;max-width:100%;margin:0 auto;background:#fff;padding:10mm 10mm 8mm 10mm;box-shadow:0 4px 20px rgba(0,0,0,.2);position:relative}
.sheet-header{text-align:center;border-bottom:2px solid #0a1f4d;padding-bottom:4px;margin-bottom:5mm}.sheet-header b{font-size:13px}.sheet-header small{font-size:10px;color:#555}
.sheet-footer{position:absolute;bottom:5mm;left:10mm;right:10mm;display:flex;justify-content:space-between;font-size:9px;color:#666;border-top:1px solid #ddd;padding-top:3px}
.barcode-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr);gap:3mm;height:245mm}
.barcode-card{border:1.2px solid #111;border-radius:6px;padding:2.5mm 2mm 2mm;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;background:#fff;position:relative}
.barcode-card .company{font-size:9px;font-weight:900;letter-spacing:1.8px;color:#0a1f4d}
.barcode-card .school{font-size:9px;font-weight:800;background:#fef3c7;padding:1px 6px;border-radius:10px;margin:1mm 0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barcode-card .name{font-size:12px;font-weight:900;line-height:1.15;min-height:26px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.barcode-card svg{width:100%;height:34px}
.barcode-card .code{font-size:9px;letter-spacing:2px}
.barcode-card .bookNo{font-size:13px;font-weight:900;color:#fff;background:#0a1f4d;padding:2px 12px;border-radius:20px;margin-top:1mm}
.barcode-card .price{font-size:11px;font-weight:800;color:#059669}.barcode-card .subj{font-size:8px;font-weight:800;background:#ede9fe;color:#5b21b6;padding:1px 8px;border-radius:10px;margin-top:1px}
.barcode-card .meta{font-size:7px;color:#777}.removeBtn{font-size:10px;background:#fee2e2;border:none;padding:3px 8px;border-radius:6px;cursor:pointer;margin-top:2px}.selectBox{position:absolute;top:2px;left:4px;transform:scale(1.5);accent-color:#059669}.empty-slot{border:1.2px dotted #ccc;color:#bbb;display:flex;align-items:center;justify-content:center;font-size:10px;flex-direction:column}.countBar{background:#0a1f4d;color:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:800;font-size:13px;margin:10px 0}
@page{size:A4 portrait;margin:0}
@media print{body{background:#fff;padding:0}header,.controls,.filterBar,.countBar,.no-print{display:none!important}.sheet{width:210mm;height:297mm;min-height:297mm;margin:0;padding:10mm 10mm 8mm;box-shadow:none;page-break-after:always}.sheet:last-child{page-break-after:auto}.barcode-grid{height:245mm}.removeBtn,.selectBox{display:none!important}.empty-slot{border:none;color:transparent}}
@media(max-width:820px){.sheet{width:100%;padding:12px;min-height:auto}.barcode-grid{height:auto;grid-template-rows:repeat(5,110px)}}
</style></head><body>
<header class="no-print"><h1>📚 MAKHANANI <span>LTSM</span> — TEXTBOOK BARCODES</h1><p>Xintimani Group • 078 023 3263 • A4 • 3x5 = 15 Per Page • v1.58</p></header>
<div class="no-print" style="text-align:center;margin:12px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><a href="textbook-barcode.html" style="background:#059669;color:#fff;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:800;outline:3px solid #d4af37">📚 TEXTBOOK</a><a href="learner-barcode.html" style="background:#7c3aed;color:#fff;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:800">🎓 LEARNER</a><a href="https://vusichauke3037-glitch.github.io/MAKHANANI-LTSM/" style="background:#0a1f4d;color:#fff;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:800">🏠 BACK TO LTSM</a></div>
<div class="controls no-print" style="border:3px solid #d4af37"><label style="font-weight:900">🏫 SCHOOL NAME:</label><input id="schoolNameInput" value="WORDSWORTH HIGH SCHOOL" oninput="changeSchool(this.value)"><button class="gold" onclick="setSchool('WORDSWORTH HIGH SCHOOL')">WORDSWORTH</button><button class="blue" onclick="setSchool(prompt('Enter School Name:')||'')">SET SCHOOL</button></div>
<div class="filterBar no-print"><h3 style="margin:0 0 8px">🔍 TEXTBOOK SEARCH + FILTER</h3><div class="filterRow"><input id="searchTitle" placeholder="🔍 Search Title / Textbook No — e.g. Maths, ACC-0001" oninput="applyFilters()"><select id="filterSubject" onchange="applyFilters()"><option value="ALL">📚 ALL SUBJECTS</option><option>Accounting</option><option>Mathematics</option><option>Maths Lit</option><option>English</option><option>Afrikaans</option><option>isiZulu</option><option>Physical Sciences</option><option>Life Sciences</option><option>Natural Sciences</option><option>Geography</option><option>History</option><option>Business Studies</option><option>Economics</option><option>CAT</option><option>Life Orientation</option><option>Technology</option><option>Other</option></select><select id="filterGrade" onchange="applyFilters()"><option value="ALL">🎓 ALL GRADES</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div class="filterRow" style="margin-top:8px"><button class="green" onclick="selectAllFiltered()">✅ SELECT ALL FILTERED</button><button class="grey" onclick="deselectAll()">⬜ DESELECT ALL</button><button class="gold" onclick="printMode('filtered')">🖨️ PRINT FILTERED</button><button class="blue" onclick="printMode('selected')">🖨️ PRINT SELECTED ONLY ✓</button><button class="dark" onclick="printMode('all')">🖨️ PRINT ALL</button>
<button class="orange" onclick="importOldBooks()" style="background:#ea580c;color:#fff">📥 IMPORT OLD BOOKS</button> <button class="red" onclick="resetFilters()">🔄 RESET</button></div></div>
<div id="countBar" class="countBar no-print">Showing: 0 • Selected: 0 • Will Print: 0</div>
<div class="controls no-print"><input id="pTitle" placeholder="Title — e.g. Maths Lit Gr 12 Textbook"><select id="pSubject"><option>Maths Lit</option><option>Mathematics</option><option>Accounting</option><option>English</option><option>Physical Sciences</option><option>Life Sciences</option><option>Natural Sciences</option><option>Geography</option><option>History</option><option>Business Studies</option><option>Economics</option><option>CAT</option><option>Other</option></select><select id="pGrade"><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select><input id="pBookNo" placeholder="Textbook No — e.g. ACC-0001"><input id="pCode" placeholder="Barcode — auto = Textbook No"><input id="pPrice" placeholder="Price — optional" type="number"><button class="green" onclick="addProduct()">➕ ADD TEXTBOOK</button><button class="blue" onclick="fillTextbooks()">📄 FILL 15</button><button class="gold" onclick="window.print()">🖨️ PRINT</button><button class="red" onclick="clearAll()">🗑️ CLEAR</button></div>
<div class="controls no-print"><b>Bulk: Title | Subject | Grade | Textbook No | Barcode | Price</b><textarea id="bulkText" rows="2" style="width:100%;padding:10px;border-radius:10px;border:1px solid #ddd" placeholder="Maths Lit Gr 12 | Maths Lit | Grade 12 | ACC-0001 | ACC-0001 | 299"></textarea><button class="dark" style="width:100%" onclick="bulkAdd()">📋 ADD ALL FROM LIST</button><p id="bulkStatus"></p></div>
<div id="sheets"></div>
<div class="controls no-print"><button class="blue" onclick="addPage()">➕ ADD BLANK PAGE (15)</button><button class="gold" onclick="window.print()">🖨️ PRINT — v1.58</button></div>
<script>
const V="v1.58"; let SCHOOL=localStorage.getItem('LTSM_SCHOOL_NAME_v158')||'WORDSWORTH HIGH SCHOOL'; document.getElementById('schoolNameInput').value=SCHOOL;
let searchTerm='',filterSubject='ALL',filterGrade='ALL',printModeState='all'; let selectedIds=new Set(JSON.parse(localStorage.getItem('LTSM_SELECTED_TEXTBOOK_v158')||'[]'));
function saveSelected(){localStorage.setItem('LTSM_SELECTED_TEXTBOOK_v158',JSON.stringify([...selectedIds]));}
function changeSchool(v){SCHOOL=v.trim().toUpperCase()||'WORDSWORTH HIGH SCHOOL';localStorage.setItem('LTSM_SCHOOL_NAME_v158',SCHOOL);render();}
function setSchool(v){if(!v)return;document.getElementById('schoolNameInput').value=v;changeSchool(v);}
let KEY='LTSM_BARCODES_TEXTBOOK_v158'; let products=JSON.parse(localStorage.getItem(KEY)||'[]').map((p,i)=>({...p,_id:p._id||'BOOK-'+i,subject:p.subject||'Other',grade:p.grade||'Grade 12'}));
if(products.length===0){products=[{name:'Maths Lit Gr 12 Textbook',subject:'Maths Lit',grade:'Grade 12',bookNo:'ACC-0001',code:'ACC-0001',price:299},{name:'Mathematics Gr 10 Textbook',subject:'Mathematics',grade:'Grade 10',bookNo:'MAT-0002',code:'MAT-0002',price:279},{name:'Natural Sciences Gr 9 Workbook',subject:'Natural Sciences',grade:'Grade 9',bookNo:'NSC-0003',code:'NSC-0003',price:149},{name:'Maths Lit Gr 11 Textbook',subject:'Maths Lit',grade:'Grade 11',bookNo:'MLIT-0006',code:'MLIT-0006',price:289},{name:'Physical Sciences Gr 12 Textbook',subject:'Physical Sciences',grade:'Grade 12',bookNo:'PHYSC-0005',code:'PHYSC-0005',price:320},{name:'Life Sciences Gr 10 Textbook',subject:'Life Sciences',grade:'Grade 10',bookNo:'LIFSC-0007',code:'LIFSC-0007',price:310},{name:'Accounting Gr 11 Textbook',subject:'Accounting',grade:'Grade 11',bookNo:'ACC-0008',code:'ACC-0008',price:295},{name:'English HL Gr 12 Textbook',subject:'English',grade:'Grade 12',bookNo:'ENGHL-0009',code:'ENGHL-0009',price:275},{name:'Geography Gr 10 Textbook',subject:'Geography',grade:'Grade 10',bookNo:'GEO-0010',code:'GEO-0010',price:260},{name:'Business Studies Gr 11',subject:'Business Studies',grade:'Grade 11',bookNo:'BUS-0011',code:'BUS-0011',price:280},{name:'Economics Gr 12',subject:'Economics',grade:'Grade 12',bookNo:'ECO-0012',code:'ECO-0012',price:290},{name:'History Gr 10',subject:'History',grade:'Grade 10',bookNo:'HIS-0013',code:'HIS-0013',price:240},{name:'CAT Gr 11 Textbook',subject:'CAT',grade:'Grade 11',bookNo:'CAT-0014',code:'CAT-0014',price:300},{name:'Maths Lit Gr 10 Textbook',subject:'Maths Lit',grade:'Grade 10',bookNo:'MLIT-0015',code:'MLIT-0015',price:285},{name:'Mathematics Gr 12 Textbook',subject:'Mathematics',grade:'Grade 12',bookNo:'MAT-0016',code:'MAT-0016',price:310}].map((p,i)=>({...p,_id:'BOOK-'+i,type:'textbook'}));save();}
function save(){localStorage.setItem(KEY,JSON.stringify(products));}
function getFiltered(){return products.filter(p=>{let q=searchTerm.trim().toLowerCase();if(q){let hay=((p.name||'')+' '+(p.bookNo||'')+' '+(p.code||'')+' '+(p.subject||'')+' '+(p.grade||'')).toLowerCase();if(!hay.includes(q))return false;}if(filterSubject!=='ALL'&&p.subject!==filterSubject)return false;if(filterGrade!=='ALL'&&p.grade!==filterGrade)return false;return true;});}
function getPrintList(){if(printModeState==='selected')return products.filter(p=>selectedIds.has(p._id));if(printModeState==='filtered')return getFiltered();return products;}
function applyFilters(){searchTerm=document.getElementById('searchTitle').value||'';filterSubject=document.getElementById('filterSubject').value;filterGrade=document.getElementById('filterGrade').value;if(searchTerm||filterSubject!=='ALL'||filterGrade!=='ALL')printModeState='filtered';render();}
function resetFilters(){document.getElementById('searchTitle').value='';document.getElementById('filterSubject').value='ALL';document.getElementById('filterGrade').value='ALL';searchTerm='';filterSubject='ALL';filterGrade='ALL';printModeState='all';render();}
function printMode(m){printModeState=m;if(m==='selected'&&selectedIds.size===0)return alert('No items ticked yet. Tick boxes first.');render();setTimeout(()=>window.print(),300);}
function selectAllFiltered(){getFiltered().forEach(p=>selectedIds.add(p._id));saveSelected();render();}
function deselectAll(){selectedIds.clear();saveSelected();render();}
function toggleSelect(id,c){if(c)selectedIds.add(id);else selectedIds.delete(id);saveSelected();updateCount();}
function updateCount(){let f=getFiltered();let pl=getPrintList();document.getElementById('countBar').textContent=`Showing: ${f.length} / ${products.length} • Selected ✓: ${selectedIds.size} • Will Print: ${pl.length} • Mode: ${printModeState.toUpperCase()} • Pages: ${Math.max(1,Math.ceil(pl.length/15))}`;}
function chunk(a,s){let o=[];for(let i=0;i<a.length;i+=s)o.push(a.slice(i,i+s));return o;}
function render(){let preview=printModeState==='all'?getFiltered():getPrintList();let pages=chunk(preview,15);if(pages.length===0)pages=[[]];document.getElementById('sheets').innerHTML=pages.map((page,pi)=>{let slots='';for(let i=0;i<15;i++){let p=page[i];if(!p){slots+=`<div class="barcode-card empty-slot"><span>EMPTY SLOT ${i+1}</span><span>${SCHOOL} • ${V}</span></div>`;}else{let chk=selectedIds.has(p._id)?'checked':'';slots+=`<div class="barcode-card"><input type="checkbox" class="selectBox no-print" ${chk} onchange="toggleSelect('${p._id}',this.checked)"><div class="company">XINTIMANI GROUP</div><div class="school">${SCHOOL}</div><div class="name">${p.name}</div><div class="subj">${p.subject} • ${p.grade}</div><svg id="bc-${pi}-${i}"></svg><div class="code">${p.code}</div><div class="bookNo">No: ${p.bookNo||p.code}</div>${p.price?`<div class="price">R${p.price}</div>`:''}<div class="meta">MAKHANANI LTSM • TEXTBOOK • 078 023 3263</div><button class="removeBtn no-print" onclick="removePById('${p._id}')">Remove ✕</button></div>`;}}return `<div class="sheet"><div class="sheet-header"><b>XINTIMANI GROUP — MAKHANANI LTSM — TEXTBOOK BARCODES</b><br><small>${SCHOOL} • ${printModeState.toUpperCase()} • Page ${pi+1} of ${pages.length} • A4 • 3x5=15 • ${V}</small></div><div class="barcode-grid">${slots}</div><div class="sheet-footer"><span>XINTIMANI GROUP • ${SCHOOL}</span><span>Page ${pi+1}/${pages.length}</span><span>078 023 3263 • ${V}</span></div></div><div style="height:16px" class="no-print"></div>`;}).join('');pages.forEach((page,pi)=>{page.forEach((p,i)=>{try{JsBarcode("#bc-"+pi+"-"+i,p.code,{format:"CODE128",displayValue:false,height:34,margin:0,width:1.4});}catch(e){}});});updateCount();}
function addProduct(){let n=document.getElementById('pTitle').value.trim();let subj=document.getElementById('pSubject').value;let grd=document.getElementById('pGrade').value;let bookNo=document.getElementById('pBookNo').value.trim().toUpperCase();let c=document.getElementById('pCode').value.trim().toUpperCase()||bookNo;let pr=document.getElementById('pPrice').value.trim();if(!n||!bookNo)return alert('Enter Title + Textbook No');products.push({name:n,subject:subj,grade:grd,bookNo:bookNo,code:c,price:pr||'',type:'textbook',_id:'BOOK-'+Date.now()+'-'+Math.random().toString(36).slice(2,5)});save();render();document.getElementById('pTitle').value='';document.getElementById('pBookNo').value='';document.getElementById('pCode').value='';document.getElementById('pPrice').value='';}
function fillTextbooks(){products=[{name:'Maths Lit Gr 12 Textbook',subject:'Maths Lit',grade:'Grade 12',bookNo:'ACC-0001',code:'ACC-0001',price:299},{name:'Mathematics Gr 10 Textbook',subject:'Mathematics',grade:'Grade 10',bookNo:'MAT-0002',code:'MAT-0002',price:279},{name:'Natural Sciences Gr 9 Workbook',subject:'Natural Sciences',grade:'Grade 9',bookNo:'NSC-0003',code:'NSC-0003',price:149},{name:'Maths Lit Gr 11 Textbook',subject:'Maths Lit',grade:'Grade 11',bookNo:'MLIT-0006',code:'MLIT-0006',price:289},{name:'Physical Sciences Gr 12 Textbook',subject:'Physical Sciences',grade:'Grade 12',bookNo:'PHYSC-0005',code:'PHYSC-0005',price:320},{name:'Life Sciences Gr 10 Textbook',subject:'Life Sciences',grade:'Grade 10',bookNo:'LIFSC-0007',code:'LIFSC-0007',price:310},{name:'Accounting Gr 11 Textbook',subject:'Accounting',grade:'Grade 11',bookNo:'ACC-0008',code:'ACC-0008',price:295},{name:'English HL Gr 12 Textbook',subject:'English',grade:'Grade 12',bookNo:'ENGHL-0009',code:'ENGHL-0009',price:275},{name:'Geography Gr 10 Textbook',subject:'Geography',grade:'Grade 10',bookNo:'GEO-0010',code:'GEO-0010',price:260},{name:'Business Studies Gr 11',subject:'Business Studies',grade:'Grade 11',bookNo:'BUS-0011',code:'BUS-0011',price:280},{name:'Economics Gr 12',subject:'Economics',grade:'Grade 12',bookNo:'ECO-0012',code:'ECO-0012',price:290},{name:'History Gr 10',subject:'History',grade:'Grade 10',bookNo:'HIS-0013',code:'HIS-0013',price:240},{name:'CAT Gr 11 Textbook',subject:'CAT',grade:'Grade 11',bookNo:'CAT-0014',code:'CAT-0014',price:300},{name:'Maths Lit Gr 10 Textbook',subject:'Maths Lit',grade:'Grade 10',bookNo:'MLIT-0015',code:'MLIT-0015',price:285},{name:'Mathematics Gr 12 Textbook',subject:'Mathematics',grade:'Grade 12',bookNo:'MAT-0016',code:'MAT-0016',price:310}].map((p,i)=>({...p,_id:'BOOK-'+i,type:'textbook'}));save();render();}
function bulkAdd(){let t=document.getElementById('bulkText').value.trim();if(!t)return alert('Paste list first');let ok=0;t.split('\n').filter(l=>l.trim()).forEach(line=>{let p=line.split('|').map(x=>x.trim());if(p.length>=2){let bn=p[3]?p[3].toUpperCase():p[1].toUpperCase();let cd=(p[4]||bn).toUpperCase();products.push({name:p[0],subject:p[1]||'Other',grade:p[2]||'Grade 10',bookNo:bn,code:cd,price:p[5]||'',type:'textbook',_id:'BOOK-'+Date.now()+'-'+ok});ok++;}});document.getElementById('bulkStatus').textContent='✅ Added: '+ok;document.getElementById('bulkText').value='';save();render();}
function addPage(){for(let i=0;i<15;i++)products.push({name:'NEW TEXTBOOK',subject:'Other',grade:'Grade 10',bookNo:'BOOK-'+String(products.length+1).padStart(4,'0'),code:'BOOK-'+String(products.length+1).padStart(4,'0'),price:'',type:'textbook',_id:'BOOK-'+Date.now()+'-'+i});save();render();}
function removePById(id){let idx=products.findIndex(p=>p._id===id);if(idx>=0){products.splice(idx,1);selectedIds.delete(id);save();saveSelected();render();}}
function importOldBooks(){
  let oldKeys=['LTSM_BARCODES_TEXTBOOK','LTSM_BARCODES','LTSM_BARCODES_TEXTBOOK_v157','LTSM_BARCODES_LEARNER_v158'];
  let found=0;
  oldKeys.forEach(k=>{
    let d=JSON.parse(localStorage.getItem(k)||'[]');
    d.forEach(b=>{
      let code=(b.code||b.bookNo||'').toUpperCase();
      if(code && !products.find(p=>p.code===code)){
        products.push({name:b.name||b.title||'OLD BOOK',subject:b.subject||'Other',grade:b.grade||'Grade 10',bookNo:b.bookNo||code,code:code,price:b.price||'',type:'textbook',_id:'BOOK-OLD-'+code});
        found++;
      }
    });
  });
  if(found===0) return alert('No old books found in this phone/browser.\n\nTry: Open old link barcode.html?type=textbook on THIS SAME phone — if books show there, tap IMPORT there.');
  save(); render(); alert('✅ Imported: '+found+' old books!');
}
function clearAll(){if(confirm('Clear all textbooks?')){products=[];selectedIds.clear();save();saveSelected();render();}}
document.getElementById('pBookNo').addEventListener('input',function(){if(!document.getElementById('pCode').value)document.getElementById('pCode').value=this.value.toUpperCase();});
render();
</script></body></html>
